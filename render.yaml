services:
  - type: web
    name: prana-yoga-ar
    runtime: node
    region: ohio
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node dist/server.cjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
